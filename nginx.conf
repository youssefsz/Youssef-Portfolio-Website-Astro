server {
    listen 80;
    server_name www.youssef.tn;

    return 301 https://youssef.tn$request_uri;
}

server {
    listen 80;
    server_name youssef.tn localhost;

    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
