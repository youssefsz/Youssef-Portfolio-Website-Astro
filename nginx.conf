map "$http_accept:$uri" $agent_markdown_uri {
    default "";
    ~*text/markdown:/$ /agent-content/index.md;
    ~*text/markdown:/projects/?$ /agent-content/projects.md;
    ~*text/markdown:/fr/?$ /agent-content/fr/index.md;
    ~*text/markdown:/fr/projects/?$ /agent-content/fr/projects.md;
}

server {
    listen 80;
    server_name www.youssef.tn;

    return 301 https://youssef.tn$request_uri;
}

server {
    listen 80;
    server_name youssef.tn localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/markdown;

    add_header Content-Signal "ai-train=yes, search=yes, ai-input=yes" always;
    add_header Vary "Accept" always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ^~ /agent-content/ {
        internal;
        types { text/markdown md; }
        default_type text/markdown;
        try_files $uri =404;
    }

    location / {
        if ($agent_markdown_uri != "") {
            rewrite ^ $agent_markdown_uri last;
        }
        try_files $uri $uri/ $uri.html =404;
    }
}
