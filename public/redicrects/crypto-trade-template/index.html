<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting… | CryptoTrade</title>
    <meta name="description" content="Redirecting to CryptoTrade" />
    <meta http-equiv="refresh" content="4; url=https://crypto-trade-template-2617.vercel.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.geist-ui.dev/font.css" rel="stylesheet" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        --background: hsl(0 0% 4%);
        --foreground: hsl(0 0% 100%);
        --primary: #4ade80; /* matches tailwind primary */
        --primary-2: #22c55e; /* gradient end */
        --muted-foreground: hsl(0 0% 64%);
        --border: hsl(0 0% 12%);
        --radius: 12px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: Geist, Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .page {
        min-height: 100%;
        display: grid;
        align-items: center;
        justify-items: center;
        padding: 4rem 1.25rem;
        position: relative;
        overflow: hidden;
      }

      /* Subtle background glow */
      .bg-glow {
        position: absolute;
        inset: -20% -20% auto -20%;
        height: 60vh;
        background: radial-gradient(60% 60% at 50% 0%, rgba(34, 197, 94, 0.25), transparent 60%),
                    radial-gradient(40% 40% at 80% 30%, rgba(74, 222, 128, 0.15), transparent 60%);
        filter: blur(40px);
        pointer-events: none;
      }

      .container {
        width: 100%;
        max-width: 48rem; /* ~768px */
        position: relative;
        z-index: 1;
      }

      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        border-radius: 16px;
        position: relative;
        border: 1px solid transparent;
      }

      .glass:before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(225deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        pointer-events: none;
      }

      .card {
        padding: 2rem;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(10, 10, 10, 0.8);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        animation: fadeUp 500ms ease-out both;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
        color: var(--foreground);
        padding: 0.375rem 0.75rem;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.06);
        margin-bottom: 1rem;
        animation: fadeIn 400ms ease-out both 120ms;
      }

      h1 {
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem 0;
        font-size: clamp(2rem, 3vw + 1rem, 3.5rem);
      }

      .subtext {
        color: var(--muted-foreground);
        font-size: clamp(1rem, 0.6vw + 0.8rem, 1.125rem);
        margin: 0 0 1.5rem 0;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }

      .button-gradient {
        background: linear-gradient(90deg, var(--primary), var(--primary-2));
        color: white;
        border: 0;
        border-radius: 9999px;
        padding: 0.875rem 1.25rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 180ms ease, opacity 180ms ease;
      }
      .button-gradient:hover { opacity: 0.95; transform: translateY(-1px); }
      .button-gradient:active { transform: translateY(0); }

      .link {
        color: white;
        text-decoration: none;
        opacity: 0.85;
        transition: opacity 180ms ease;
      }
      .link:hover { opacity: 1; text-decoration: underline; }

      .progress {
        width: 100%;
        height: 8px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.06);
        margin: 1rem 0 0.5rem 0;
      }
      .bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--primary), var(--primary-2));
        animation: grow 4s linear forwards;
      }

      @keyframes grow { from { width: 0%; } to { width: 100%; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0);} }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 700;
      }
      .brand-badge {
        width: 22px; height: 22px; border-radius: 6px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        display: grid; place-items: center; color: #0a0a0a; font-size: 14px; font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="bg-glow" aria-hidden="true"></div>
      <div class="container">
        <div class="eyebrow brand">
          <span class="brand-badge">¢</span>
          <span>CryptoTrade</span>
        </div>

        <div class="glass card">
          <h1>Redirecting you to CryptoTrade</h1>
          <p class="subtext">
            You will be redirected in <span id="seconds">4</span> seconds.
          </p>
          <div class="progress" aria-hidden="true"><div class="bar"></div></div>
          <div class="row" style="margin-top: 0.5rem;">
            <button id="redirectNow" class="button-gradient">Redirect now</button>
            <a class="link" href="https://crypto-trade-template-2617.vercel.app/" rel="noopener">Open link in a new tab</a>
          </div>
        </div>
      </div>
    </div>

    <noscript>
      <div style="position:fixed;inset:0;display:grid;place-items:center;background:#0a0a0a;color:#fff;font-family:Geist,Inter,sans-serif">
        <p>JavaScript is disabled. <a href="https://crypto-trade-template-2617.vercel.app/" style="color:#4ade80">Continue to CryptoTrade</a>.</p>
      </div>
    </noscript>

    <script>
      (function () {
        const target = "https://crypto-trade-template-2617.vercel.app/";
        const secondsEl = document.getElementById("seconds");
        const btn = document.getElementById("redirectNow");
        let remaining = 4;

        const tick = () => {
          remaining -= 1;

        };

        const to = setTimeout(() => { window.location.replace(target); }, 4000);

        btn.addEventListener("click", () => {
          clearTimeout(to);

      })();
    </script>
  </body>
  </html>
