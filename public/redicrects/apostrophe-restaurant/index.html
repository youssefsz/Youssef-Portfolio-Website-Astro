<!DOCTYPE html>
<html lang="en">
<head>
    <title>Apostrophe Restaurant - Redirecting...</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Same fonts as main site -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Custom redirect styles -->
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2a2a2a 100%);
            color: white;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .redirect-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, rgba(0,0,0,0.9) 0%, rgba(26,26,26,0.8) 50%, rgba(42,42,42,0.9) 100%);
        }

        .redirect-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('logo-brasserie-apostrophe.png') no-repeat center center;
            background-size: 300px 300px;
            opacity: 0.03;
            animation: subtle-pulse 4s ease-in-out infinite;
        }

        @keyframes subtle-pulse {
            0%, 100% { opacity: 0.03; transform: scale(1); }
            50% { opacity: 0.05; transform: scale(1.02); }
        }

        .redirect-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
            border-radius: 20px;
            padding: 25px 30px;
            border: 2px solid transparent;
            background-clip: padding-box;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 0 0 2px rgba(255,140,0,0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 2;
            animation: elegant-fade-in 1.2s ease-out;
        }

        @keyframes elegant-fade-in {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo-section {
            margin-bottom: 20px;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 10px;
            opacity: 0.9;
            transition: all 0.4s ease;
        }

        .logo:hover {
            transform: scale(1.05);
            opacity: 1;
        }

        .brand-line {
            width: 80px;
            height: 4px;
            background: linear-gradient(135deg, #FF8C00, #FFA500, #ffd662);
            border-radius: 2px;
            margin: 0 auto;
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffffff 0%, #ffd662 50%, #ff8c42 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 20px;
            font-weight: 300;
        }

        .countdown-section {
            margin: 20px 0;
        }

        .countdown-timer {
            font-size: 3.5rem;
            font-weight: 700;
            color: #FF8C00;
            font-family: 'Dosis', sans-serif;
            text-shadow: 0 0 20px rgba(255,140,0,0.5);
            animation: countdown-pulse 1s ease-in-out infinite;
        }

        @keyframes countdown-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .countdown-text {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            margin-top: 10px;
        }

        .redirect-button {
            display: inline-block;
            background: linear-gradient(135deg, #e52b34 0%, #ff6b35 30%, #ff8c42 60%, #ffd662 100%);
            color: white;
            padding: 15px 35px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 8px 25px rgba(229, 43, 52, 0.4);
            position: relative;
            overflow: hidden;
            background-size: 200% 200%;
            animation: gradient-shift 3s ease-in-out infinite;
            margin-top: 20px;
        }

        .redirect-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(229, 43, 52, 0.6);
            background-position: right center;
        }

        .redirect-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .redirect-button:hover::before {
            left: 100%;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            font-style: italic;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .redirect-card {
                padding: 20px 20px;
                margin: 15px;
                max-width: 380px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .countdown-timer {
                font-size: 2.8rem;
            }

            .logo {
                width: 70px;
                height: 70px;
            }

            .redirect-button {
                padding: 12px 28px;
                font-size: 0.95rem;
            }
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-card">
            <div class="logo-section">
                <img src="logo-brasserie-apostrophe.png" alt="Apostrophe Restaurant" class="logo">
                <div class="brand-line"></div>
            </div>

            <h1>Redirecting...</h1>
            <p class="subtitle">You will be redirected to our new website shortly</p>

            <div class="countdown-section">
                <div class="countdown-timer" id="countdown">4</div>
                <p class="countdown-text">seconds remaining</p>
            </div>

            <a href="https://hemelslekker.be/" class="redirect-button" id="redirectButton">
                <span>Continue Now</span>
                <i class="fa fa-arrow-right" style="margin-left: 10px;"></i>
            </a>

            <p class="footer-text">Apostrophe Restaurant - Fine Dining in Olsene, Belgium</p>
        </div>
    </div>

    <script>
        // Countdown timer
        let countdown = 4;
        const countdownElement = document.getElementById('countdown');
        const redirectButton = document.getElementById('redirectButton');

        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;

            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = 'https://hemelslekker.be/';
            }
        }, 1000);

        // Manual redirect
        redirectButton.addEventListener('click', (e) => {
            e.preventDefault();
            clearInterval(timer);
            window.location.href = 'https://hemelslekker.be/';
        });

        // Add some interactive effects
        document.addEventListener('DOMContentLoaded', () => {
            // Add subtle animation to the card on load
            setTimeout(() => {
                const card = document.querySelector('.redirect-card');
                card.style.transform = 'translateY(0) scale(1)';
                card.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
