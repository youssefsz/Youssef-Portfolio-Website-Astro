<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Redirecting to HumidScan</title>
    <link rel="icon" type="image/png" sizes="16x16" href="../public/favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../public/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../public/favicons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: oklch(0.485 0.165 256.4);
            --background: oklch(0.9702 0 0);
            --foreground: oklch(0.4091 0 0);
            --muted: oklch(0.5624 0 0);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--foreground);
            letter-spacing: -0.02em;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .title {
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--foreground);
        }

        .subtitle {
            font-size: 0.9375rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .progress-bar-wrapper {
            width: 100%;
            max-width: 280px;
            height: 4px;
            background-color: rgba(0, 0, 0, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .timer {
            font-size: 0.875rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.75rem;
            font-size: 0.9375rem;
            font-weight: 600;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .button svg {
            width: 18px;
            height: 18px;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .button:hover svg {
            transform: translateX(2px);
        }

        .footer {
            position: fixed;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8125rem;
            color: var(--muted);
            opacity: 0;
            animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: oklch(0.2178 0 0);
                --foreground: oklch(0.9067 0 0);
                --muted: oklch(0.7572 0 0);
            }

            .progress-bar-wrapper {
                background-color: rgba(255, 255, 255, 0.1);
            }
        }

        @media (max-width: 480px) {
            .brand-name {
                font-size: 1.25rem;
            }

            .title {
                font-size: 1rem;
            }

            .subtitle {
                font-size: 0.875rem;
            }

            .button {
                padding: 0.75rem 1.5rem;
                font-size: 0.875rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo-section">
            <img src="logo.jpg" alt="HumidScan Logo" class="logo">
            <span class="brand-name">HumidScan</span>
        </div>

        <div class="content">
            <h1 class="title">Redirecting you to HumidScan</h1>
            <p class="subtitle">You will be automatically redirected in a moment</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar-wrapper">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <span class="timer" id="timer">3s</span>
        </div>

        <a href="https://humidscan.com" class="button" id="manualRedirect">
            Go to HumidScan
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
            </svg>
        </a>
    </div>

    <footer class="footer">
        Humidity Detection & Prevention App
    </footer>

    <script>
        (function () {
            const REDIRECT_URL = 'https://humidscan.com';
            const DURATION = 3000; // 3 seconds
            const UPDATE_INTERVAL = 50; // Update every 50ms for smooth animation

            const progressBar = document.getElementById('progressBar');
            const timerDisplay = document.getElementById('timer');

            let startTime = Date.now();
            let redirected = false;

            function updateProgress() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min((elapsed / DURATION) * 100, 100);
                const remaining = Math.max(Math.ceil((DURATION - elapsed) / 1000), 0);

                progressBar.style.width = progress + '%';
                timerDisplay.textContent = remaining + 's';

                if (elapsed >= DURATION && !redirected) {
                    redirected = true;
                    window.location.href = REDIRECT_URL;
                } else if (!redirected) {
                    requestAnimationFrame(updateProgress);
                }
            }

            // Start the progress animation
            requestAnimationFrame(updateProgress);
        })();
    </script>
</body>

</html>
